name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # renderMermaidToSvg() launches puppeteer-core directly (backend/lib/
      # mermaid.ts), and puppeteer-core — unlike full puppeteer — never
      # auto-detects a browser: it throws "An `executablePath` or `channel`
      # must be specified" unless PUPPETEER_EXECUTABLE_PATH is set. `npx
      # puppeteer browsers install chrome` only downloads the binary; it
      # does not export its install path anywhere, so that env var has to
      # be captured from this step's own output and written to $GITHUB_ENV
      # for every later step in this job to inherit.
      - name: Install headless Chromium for mmdc
        run: |
          INSTALL_OUTPUT=$(npx --yes puppeteer browsers install chrome)
          echo "$INSTALL_OUTPUT"
          CHROME_PATH=$(echo "$INSTALL_OUTPUT" | tail -n1 | awk '{print $NF}')
          if [ ! -x "$CHROME_PATH" ]; then
            echo "::error::Could not determine the installed Chrome executable path from: $INSTALL_OUTPUT"
            exit 1
          fi
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Type-check
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

      - name: Build the Action bundle
        run: npm run build --workspace=action

      - name: Full pipeline dry run (Action -> backend -> mmdc -> comment)
        run: npx tsx scripts/dry-run.ts

      - name: Fail if the Action's committed dist/ is stale
        run: |
          git diff --exit-code -- action/dist || \
            (echo "::error::action/dist/index.js is out of date — run 'npm run build --workspace=action' and commit the result." && exit 1)
